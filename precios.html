<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis Galarraga — BI & Data Analytics</title>

<meta property="og:title" content="Luis Galarraga — BI & Data Analytics">
<meta property="og:description" content="Transformo datos crudos en decisiones estratégicas. Especialista en Power BI, DAX y arquitecturas de datos con 5+ años en operaciones críticas.">
<meta property="og:image" content="https://legaracer1979.github.io/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://legaracer1979.github.io">
<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
:root{--bg:#0a0a0f;--border:#1e1e2e;--accent:#00c8ff;--accent2:#7b61ff;--text:#e8e8f0;--muted:#6b6b80;--card:#13131c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:var(--text);text-decoration:none}
.logo span{color:var(--accent)}
.nav-btn{padding:0.5rem 1rem;background:var(--accent);color:#000;border-radius:6px;font-size:0.82rem;font-weight:500;text-decoration:none}
#hero{min-height:60vh;display:flex;align-items:center;padding:7rem 1.5rem 3rem;max-width:900px;margin:0 auto}
.htag{display:inline-flex;align-items:center;gap:0.5rem;background:rgba(0,200,255,0.08);border:1px solid rgba(0,200,255,0.2);border-radius:100px;padding:0.3rem 1rem;font-size:0.75rem;font-weight:500;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:1.5rem}
.htag::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.8rem,5vw,3.5rem);line-height:1.1;letter-spacing:-0.04em}
h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.desc{margin-top:1.5rem;font-size:1rem;color:var(--muted);max-width:520px;line-height:1.8}
.btn{display:inline-flex;align-items:center;padding:0.8rem 1.6rem;border-radius:6px;font-size:0.9rem;font-weight:500;text-decoration:none;transition:all 0.2s;border:none;cursor:pointer}
.btn-p{background:var(--accent);color:#000}
.btn-p:hover{background:#fff}
.sec{padding:3rem 1.5rem 5rem;max-width:900px;margin:0 auto}
.sec-lbl{font-size:0.72rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);margin-bottom:0.8rem}
h2{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.15;letter-spacing:-0.03em;color:var(--text);margin-bottom:1.5rem}
.cbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem 1.5rem;max-width:100%;margin:0 auto;text-align:left}
.demo-label{display:block;font-size:0.82rem;color:var(--muted);margin:1rem 0 0.4rem;font-weight:500}
.demo-input{width:100%;padding:0.7rem 0.9rem;background:#0a0a0f;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem}
.demo-row{display:flex;gap:0.6rem;margin-bottom:0.6rem}
.demo-half{flex:1}
.chip{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:0.65rem 0.9rem;font-size:0.83rem;color:var(--text);line-height:1.8}
footer{border-top:1px solid var(--border);padding:1.5rem;text-align:center;font-size:0.78rem;color:var(--muted)}
@media(max-width:640px){#hero{padding-top:1.5rem}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Legaracer<span>.</span></a>
  <a href="index.html" class="nav-btn">← Volver al portafolio</a>
</nav>

<section id="hero">
  <div>
    <div class="htag">Herramienta Personal</div>
    <h1>Variación de <span class="grad">Precios</span> de Supermercado</h1>
    <p class="desc">Registra tus compras y descubre cómo varían los precios en el tiempo, ajustados a la tasa BCV del día.</p>
  </div>
</section>

<section class="sec">
  <div class="sec-lbl">Nueva Compra</div>
  <h2>Agregar Producto</h2>

  <div class="cbox">

    <label class="demo-label">Nombre del producto</label>
    <input type="text" id="p-nombre" class="demo-input" placeholder="Ej: Harina de Maíz P.A.N.">

    <label class="demo-label">Marca</label>
    <input type="text" id="p-marca" class="demo-input" placeholder="Ej: P.A.N.">

    <div class="demo-row">
      <div class="demo-half">
        <label class="demo-label">Peso / Presentación</label>
        <input type="text" id="p-peso" class="demo-input" placeholder="Ej: 1kg">
      </div>
      <div class="demo-half">
        <label class="demo-label">Fecha de compra</label>
        <input type="date" id="p-fecha" class="demo-input">
      </div>
    </div>

    <div class="demo-row">
      <div class="demo-half">
        <label class="demo-label">Precio</label>
        <input type="number" id="p-precio" class="demo-input" placeholder="0.00" step="0.01">
      </div>
      <div class="demo-half">
        <label class="demo-label">Moneda</label>
        <select id="p-moneda" class="demo-input">
          <option value="USD">$ Dólares</option>
          <option value="BS">Bs Bolívares</option>
        </select>
      </div>
    </div>

    <label class="demo-label">Forma de pago</label>
    <select id="p-pago" class="demo-input">
      <option value="efectivo">Efectivo</option>
      <option value="tarjeta">Tarjeta</option>
      <option value="cashea">Cashea</option>
    </select>

    <div id="cashea-extra" style="display:none;">
      <label class="demo-label">Fecha próxima cuota</label>
      <input type="date" id="p-cuota" class="demo-input">
    </div>

    <button class="btn btn-p" style="margin-top:1.5rem;width:100%;justify-content:center;" onclick="guardarProducto()">Guardar Producto</button>

    <div id="resultado" style="margin-top:1.5rem;"></div>

  </div>
</section>

<footer>
  Hecho por <span style="color:var(--accent)">Luis Galarraga</span> — Legaracer
</footer>

<script>
document.getElementById('p-pago').addEventListener('change', function(){
  document.getElementById('cashea-extra').style.display = this.value === 'cashea' ? 'block' : 'none';
});

async function obtenerTasaBCV() {
  try {
    const res = await fetch('https://pydolarve.org/api/v1/dollar?page=bcv');
    const data = await res.json();
    return data.monitors.usd.price;
  } catch (e) {
    const manual = prompt('No se pudo obtener la tasa BCV automáticamente. Escribe la tasa de hoy (Bs por $):');
    return parseFloat(manual);
  }
}

function formatNum(num) {
  return num.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

async function guardarProducto() {
  const nombre = document.getElementById('p-nombre').value.trim();
  const marca = document.getElementById('p-marca').value.trim();
  const peso = document.getElementById('p-peso').value.trim();
  const fecha = document.getElementById('p-fecha').value;
  const precioInput = parseFloat(document.getElementById('p-precio').value);
  const moneda = document.getElementById('p-moneda').value;
  const pago = document.getElementById('p-pago').value;
  const cuota = document.getElementById('p-cuota').value;

  if (!nombre || !fecha || isNaN(precioInput)) {
    alert('Por favor completa al menos nombre, fecha y precio.');
    return;
  }

  const tasaBCV = await obtenerTasaBCV();

  let precioUSD, precioBS;
  if (moneda === 'USD') {
    precioUSD = precioInput;
    precioBS = precioInput * tasaBCV;
  } else {
    precioBS = precioInput;
    precioUSD = precioInput / tasaBCV;
  }

  const nuevoRegistro = {
    nombre, marca, peso, fecha,
    precioUSD, precioBS, tasaBCV,
    pago, cuota: pago === 'cashea' ? cuota : null
  };

  let datos = JSON.parse(localStorage.getItem('precios-luis') || '[]');

  const anterior = datos
    .filter(p => p.nombre.toLowerCase() === nombre.toLowerCase() && p.marca.toLowerCase() === marca.toLowerCase())
    .sort((a,b) => new Date(b.fecha) - new Date(a.fecha))[0];

  datos.push(nuevoRegistro);
  localStorage.setItem('precios-luis', JSON.stringify(datos));

  mostrarResultado(nuevoRegistro, anterior);

  document.getElementById('p-nombre').value = '';
  document.getElementById('p-marca').value = '';
  document.getElementById('p-peso').value = '';
  document.getElementById('p-precio').value = '';
}

function mostrarResultado(actual, anterior) {
  const div = document.getElementById('resultado');

  if (!anterior) {
    div.innerHTML = <div class="chip">✅ Guardado. Primera vez que registras <b>${actual.nombre}</b>. Tasa BCV usada: ${formatNum(actual.tasaBCV)} Bs.</div>;
    return;
  }

  const varUSD = ((actual.precioUSD - anterior.precioUSD) / anterior.precioUSD * 100);
  const varBS = ((actual.precioBS - anterior.precioBS) / anterior.precioBS * 100);

  const flechaUSD = varUSD > 0 ? '📈' : varUSD < 0 ? '📉' : '➡️';
  const flechaBS = varBS > 0 ? '📈' : varBS < 0 ? '📉' : '➡️';

  div.innerHTML = `
    <div class="chip">
      <b>${actual.nombre}</b> — comparado con tu compra del ${anterior.fecha}<br>
      ${flechaUSD} En $: ${formatNum(anterior.precioUSD)} → ${formatNum(actual.precioUSD)} (${varUSD.toFixed(1)}%)<br>
      ${flechaBS} En Bs: ${formatNum(anterior.precioBS)} → ${formatNum(actual.precioBS)} (${varBS.toFixed(1)}%)
    </div>`;
}
</script>

</body>
</html>
